# Nginx server block for the bestiary.
#
# Add via symlink from /etc/nginx/sites-enabled/:
#   sudo ln -s /srv/bestiary/current/infra/nginx/bestiary.conf \
#              /etc/nginx/sites-enabled/bestiary
#   sudo nginx -t && sudo systemctl reload nginx
#
# The 80 -> 443 redirect is handled by the existing default server on the
# shared VPS (same one quartzo relies on); this file only defines the 443
# server. The server_name is intentionally specific — no catch-all.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bestiary.sysnode.com.br;

    # TLS — the wildcard *.sysnode.com.br cert should cover this subdomain.
    # If a subdomain-specific cert was issued via certbot, swap these two
    # lines to point at /etc/letsencrypt/live/bestiary.sysnode.com.br/.
    ssl_certificate     /etc/letsencrypt/live/sysnode.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sysnode.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (mirrors quartzo).
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body limit — batch endpoints accept up to 100 items but bodies
    # stay well under 1MB. Keep the ceiling low to make abuse noisy.
    client_max_body_size 2m;

    # Log to dedicated files so bestiary noise doesn't drown quartzo's logs.
    access_log /var/log/nginx/bestiary.access.log;
    error_log  /var/log/nginx/bestiary.error.log;

    # -----------------------------------------------------------------
    # API — everything under /api/ is proxied to PM2 on localhost:5610.
    # -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5610;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health probe — same backend, no logging to keep the access log clean.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:5610/health;
    }

    # OpenAPI schema — cached briefly (agents fetch it often).
    location = /openapi.json {
        proxy_pass http://127.0.0.1:5610/openapi.json;
        expires 5m;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------
    # Static SPA — Vite build output. Immutable assets get a year of
    # caching; index.html is always fresh so route changes ship on refresh.
    # -----------------------------------------------------------------
    root /srv/bestiary/current/apps/web/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
